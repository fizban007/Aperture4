# A2.0 Deutsch stationarity benchmark — causally clean protocol.
# Exact retarded rotating-point-dipole IC ("Deutsch") + same analytic
# inner BC.  The solution is periodic with P = 2pi/Omega = 31.415927.
# r_max = 45 > 9 + P, so for one period the outer boundary is causally
# invisible from the measurement region r < 9: NO damping is used and
# the recurrence error ||F(P) - F(0)|| (r < 9) is pure solver error.
# dt = P/1600 so the step-1600 dump lands exactly at t = P.
# Analysis: deutsch_stationarity.py --steps-per-period 1600.
# Measured 2026-07-16 (post half-step + flat-metric fixes): errB(r<9)
# L4/L5/L6 = 4.10e-3 / 1.37e-3 / 6.94e-4; errE = 2.27e-2 / 1.17e-2 /
# 6.61e-3.  The ~1.9x errE ratios reflect a first-order component from
# driving the discrete interior with the analytic inner BC (mismatch
# O(h^2) per step accumulated over 1/dt steps); see roadmap A2 notes.
dt = 0.019634954084936207
max_steps = 1600
subdivision_level = 4
N_r = 51
r_min = 1.0
r_max = 45.0
Bp = 1.0
Omega = 0.2
obliquity = 1.0471975511965976
use_flat_metric = true
use_deutsch_ic = true
use_deutsch_bc = true
damping_length = 0
damping_coef = 0.0
fld_output_interval = 400
output_dir = "Data_deutsch_L4"
sph_N_theta = 64
sph_N_phi = 128
