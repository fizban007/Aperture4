# A2.0 Deutsch stationarity benchmark — causally clean protocol.
# Exact retarded rotating-point-dipole IC ("Deutsch") + same analytic
# inner BC.  The solution is periodic with P = 2pi/Omega = 31.415927.
# r_max = 45 > 9 + P, so for one period the outer boundary is causally
# invisible from the measurement region r < 9: NO damping is used and
# the recurrence error ||F(P) - F(0)|| (r < 9) is pure solver error.
# dt = P/6400 so the step-6400 dump lands exactly at t = P.
# Analysis: deutsch_stationarity.py --steps-per-period 6400.
# Measured 2026-07-16 (commit-time): errB(r<9) L4/L5/L6 =
#   4.17e-3 / 1.38e-3 / 6.85e-4;  errE = 2.25e-2 / 1.17e-2 / 6.52e-3.
# errE (and the L5->L6 errB ratio) are floored by an O(dt) component:
# the IC and inner BC evaluate B at integer times while the leapfrog B
# is half-step staggered.  See roadmap A2 notes for the planned fix.
dt = 0.004908738521234052
max_steps = 6400
subdivision_level = 6
N_r = 204
r_min = 1.0
r_max = 45.0
Bp = 1.0
Omega = 0.2
obliquity = 1.0471975511965976
use_deutsch_ic = true
use_deutsch_bc = true
damping_length = 0
damping_coef = 0.0
fld_output_interval = 1600
output_dir = "Data_deutsch_L6"
sph_N_theta = 64
sph_N_phi = 128
