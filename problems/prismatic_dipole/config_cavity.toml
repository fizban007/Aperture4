# Spherical cavity TE/TM eigenmode test for vacuum Maxwell convergence.
#
# Single mode of a spherical resonator with PEC walls at r_min, r_max.
# Default is the lowest TE_{1,0} mode (l=1, m=0, n_root=1) starting with
# B at maximum and E = 0 at t = 0. Evolve for several periods, compare
# against the analytical eigenmode in Python (cavity_analysis.py).
#
# Binary: ./bin/cavity_resonator -c problems/prismatic_dipole/config_cavity.toml
#
# Eigenfrequency note: with c = 1, ω = k. For r_min = 1.0, r_max = 5.0,
# the lowest TE_{1,0,1} root is k ≈ 0.9373 → period T = 2π/ω ≈ 6.7036.
# Set max_steps so dt * max_steps spans an integer number of periods.
# Default below: 4 periods.

dt = 0.005
max_steps = 5363          # ≈ 4 periods of TE_{1,0,1} for r_min=1, r_max=5
subdivision_level = 3
N_r = 40
r_min = 1.0
r_max = 5.0

# Mode selection
mode_l = 1                # angular quantum number (>= 1)
mode_m = 0                # azimuthal index (|m| <= l)
mode_n_root = 1           # 1 = lowest radial root
mode_polarization = "E"   # "E" for TE (B_r ≠ 0), "M" for TM (E_r ≠ 0)
start_with_e = false      # false: B max at t=0; true: E max at t=0
resonator_amp = 1.0       # overall amplitude

# Boundary conditions
use_pec_bc = true         # PEC walls at r_min and r_max
damping_length = 0        # disable outer damping for cavity test
damping_coef = 0.0

# Output
fld_output_interval = 100
output_dir = "Data_cavity"
sph_N_theta = 90
sph_N_phi = 180

# Unused but read by dec_field_solver init
Bp = 1.0
Omega = 0.0
obliquity = 0.0
