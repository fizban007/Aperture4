# L7 a50 "cool" — FULL RUN FROM t = 0 at 50 degree inclination.
#
# Third point of the inclination series 50 / 60 / 75 deg.  IDENTICAL to
# ns_rotator_L7_a60_v3_cool and ns_rotator_L7_a75_cool in every respect
# except obliquity = 0.8726646259971648 (50 deg).  Same binary
# (copied byte-for-byte along the series), same resolution, injection,
# cooling and switch knobs, max_steps and 40-node shape, so any
# difference across the three is attributable to inclination alone.
#
# PURPOSE: contrast against a60 and a75 for the surface plume feature.
# The plumes originate at the stellar surface, accelerate particles to
# high Lorentz factors, and sit near the NULL SURFACE's intersection with
# the star -- not on the return current sheet and not on the polar cap.
# Inclination moves the null surface relative to both, so a50 brackets
# the series on the low side: if the plumes track the null surface their
# surface location must vary monotonically across 50 / 60 / 75.
#
# Physics/knobs carried over unchanged (see the a60 config for the full
# rationale and the calibration measurement):
#   - synchrotron cooling ON, sync_cooling_coef = 2.56e-3 (LL drag on the
#     Boris branch; t_cool/t_gyro < 1 across the whole Boris region)
#   - gca_switch_omegac = 20.0 (dt-invariant rate, = the L6 surface)
#
# Run mechanics: FROM SCRATCH, no --restart anywhere.  checkpoints/ starts
# empty so restart_from = "auto" initialises at t = 0; resubmits pick up
# this run's own newest generation.  a60 reached 4.375 P and a75 4.0 P in
# one 2 h window; expect the same here.  NOTE the three runs are compared
# at t = 4.0 P (ckpt_40961), the deepest generation common to all three.
#
# Original v2 production header follows.
# ----------------------------------------------------------------------
# L7 oblique production rerun (a60), v2 — corrected injection normalization.
#
# The first L7 campaign (config_ns_rotator_L7_a60.toml) carried the L6
# injection knobs verbatim, but under the OLD injector convention
# inj_weight was a raw macro charge and inj_interval a step count, so
# the injected density rate scaled as 1/(V_cell*dt): L7 injected 16x
# more plasma than the L6 run it was meant to resolution-match.  The
# measured symptoms (diagnostics/ in the L7 run dir): rho_abs 5-7.5x
# L6 at matched t/P, surface corotation 0.55 vs 0.78, Y-point pulled
# inside the LC, L(R_LC) ~ 7.2 L_dip vs 4.5, and ~7x shot noise in
# rho/rho_GJ.
#
# The injector now uses the base-code convention (see
# prismatic_surface_injector.h): inj_weight is a charge density per
# coordinate cell volume — w_macro = inj_weight * Omega_tri * dln r,
# physical density/event = inj_weight / r^3 — and inj_interval is a
# TIME.  Both are resolution-invariant: they are PHYSICS knobs now and
# never rescale across levels.
#
#   inj_weight   = 240.0        = 6.87e-4 / (Omega_tri_L6 * dlnr_L6);
#                                 per-event pair density 2*240/r^3 =
#                                 0.96 rho_GJ(r)  (rho_GJ r^3 = 2 Omega Bp
#                                 = 500) — identical to the L6 physics.
#   inj_interval = 0.04908738521234052
#                                 = 10 * dt_L6 = P/512 (= 20 L7 steps),
#                                 the same physical cadence as L6.
#   inj_weight_r_scale            REMOVED (the r^2 far-zone macro
#                                 coarsening hack; the injector aborts if
#                                 it is present).  Expect a somewhat
#                                 larger far-zone (r > 5) census than the
#                                 hacked L6 run — see max_ptc_num below.
#
# Everything else is carried from config_ns_rotator_L7_a60.toml
# unchanged (FRONTIER_RUNBOOK.md §4 scaling table).  Fresh output/
# checkpoint dirs: this is a from-scratch rerun, NOT a restart — the v1
# state is overloaded and would not relax quickly.

dt = 0.0024543692606170259
max_steps = 71680
subdivision_level = 7
N_r = 408
r_min = 1.0
r_max = 45.0
Bp = 1000.0
Omega = 0.25
obliquity = 0.8726646259971648
use_flat_metric = true
use_deutsch_ic = false
use_deutsch_bc = false
use_static_background = true
damping_length = 88
damping_coef = 1.0
damping_exponent = 3.0

# --- decomposition (runbook §3) ---
n_angular_ranks = 320
ranks_per_node = 8
halo_device_direct = true
step_timer_interval = 500

# --- particles ---
# PER-RANK buffer (see the v1 config for the full sizing argument).
# v2 note: the corrected weights reproduce L6's macros-per-cell at every
# radius, ~59/cell -> ~8e9 total, but WITHOUT the r^2 far-zone
# coarsening the r > 5 census grows a few-fold: budget ~1.6e10 total,
# hot rank ~1.1e8 at the measured 2.2x imbalance — still under 30% of
# this buffer.  Watch the injector's occupancy log line early on.
max_ptc_num = 400000000
q_e = 1.0
m_e = 1.0
ptc_absorb_radius = 13.0
use_recovery_gather = true
sort_interval = 20
random_seed = 42

# --- volumetric E.B-triggered injection ---
# Resolution-invariant units (see header): density knob + time cadence.
inj_shells = 1
inj_pairs_per_cell = 1
inj_interval = 0.04908738521234052
inj_weight = 240.0
inj_kT = 0.2
inj_buffer_frac = 0.9
inj_eb_threshold = 1e-3
inj_r_max = 10.0
inj_max_multiplicity = 10.0
inj_gca = true

# --- GCA hybrid (unchanged: physics) ---
use_gca = true
include_curvature = true
gca_switch_omegac = 20.0
gca_zero_mu_on_capture = false

# --- synchrotron cooling (Boris branch only) ---
# Raw Landau-Lifshitz coefficient, given directly rather than via
# sync_gamma_rad.  t_cool(gamma, B) = 1 / (sync_cooling_coef * gamma * B^2),
# a RATE coefficient in inverse time units -- identical meaning at every
# dt and level.  2.56e-3 == the sync_gamma_rad = 5 anchoring at B_LC.
# sync_cool_b_lc is retained only so the init log can report the
# equivalent gamma_rad and t_cool; it does not enter the physics when
# sync_cooling_coef is set explicitly.
use_sync_cooling = true
sync_cooling_coef = 2.56e-3
sync_cool_b_lc = 15.625

# --- output ---
# Under MPI the in-code spherical output is skipped (runbook §4); the
# exporter writes mesh-native step_XXXXXX.h5.  sph_N_* are kept only so a
# single-rank rerun of this config behaves like the L6 one.
fld_output_interval = 1280
output_dir = "/lustre/orion/ast229/proj-shared/alex/runs/ns_rotator_L7_a50_cool/output"
sph_N_theta = 64
sph_N_phi = 128

# --- checkpoint/restart ---
checkpoint_interval = 5120
checkpoint_keep = 2
checkpoint_dir = "/lustre/orion/ast229/proj-shared/alex/runs/ns_rotator_L7_a50_cool/checkpoints"
restart_from = "auto"
