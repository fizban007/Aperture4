# Kerr-Wald convergence family, level 4 -- relaxation run
# Generated by make_conv_configs.py; edit that, not this.
#
# Relaxation test: Schwarzschild Wald IC (field_spin = 0) on the a = 0.998
# background, evolved to t = 60 M.  Scored by Phi_cap(horizon)/Phi_cap(r_ref)
# against the _ana run at the same level.

subdivision_level = 4
N_r    = 44
r_min  = 0.7
r_max  = 20.0
n_ghost_inner = 1
n_ghost_outer = 1

bh_spin         = 0.998
field_spin      = 0.0
background_spin = 0.998
B0              = 1.0
use_flat_metric = false

dt         = 0.01
max_steps  = 22000
use_implicit = true
implicit_beta = 0.52
implicit_iters = 5
use_static_background = true

damping_length = 12
damping_coef   = 0.2

fld_output_interval = 100
output_dir          = "Data_conv_L4_relax"

sph_N_theta = 90
sph_N_phi   = 180

update_d = true
update_b = true

# GRPIC_PLAN B1: constitutive Hodge map.  Pinned explicitly so the config
# means the same thing regardless of the solver's compiled-in default.
use_whitney_hodge = false
