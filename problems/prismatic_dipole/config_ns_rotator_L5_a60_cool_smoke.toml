# L5 smoke check of synchrotron cooling on the Boris branch (2026-07-28).
# Base: config_ns_rotator_L5_a60_v2smoke.toml verbatim, plus the
# use_sync_cooling block below.  Pass = the init log prints the
# "Synchrotron cooling: ON ..." lines with a sane t_cool in steps, census
# and rho_abs still track the v2 smoke numbers, and push time does not
# regress by more than ~10% (the drag is a handful of flops per Boris
# particle, so it should be well under that).
#
# Original v2 smoke header follows.
# ---------------------------------------------------------------------
# L5 smoke check of the v2 injection normalization (2026-07-21).
# Base: config_ns_rotator_L5_a60.toml (the direct coarse partner of the
# L6 a60 baseline) with exactly the v2 knob migration applied:
#   inj_weight   = 240.0                (coordinate charge density;
#                                        was 6.87e-4 raw macro charge)
#   inj_interval = 0.04908738521234052  (TIME = P/512 = 5 L5 steps;
#                                        was 10 steps = P/256 at L5)
#   inj_weight_r_scale                  DELETED (aborts if present)
# The new values are level-invariant by design — these are the SAME
# numbers as the L7 v2 production config.  1 P (2560 steps), single
# node.  Pass = injector init line shows "coordinate density 240 ...
# (5 step(s))" and census/rho_abs track the historical L5/L6 numbers
# (a few 1e8 census, NOT a v1-style over-injection ramp).
dt = 0.009817477042468103
max_steps = 2560
# 1 node x 8 GCDs: A=8 angular ranks, K=1 radial (8 = 2^3 divides
# 20*4^m; same choice as the L6 frontier config's 8-rank runs).
n_angular_ranks = 8
subdivision_level = 5
N_r = 102
r_min = 1.0
r_max = 45.0
Bp = 1000.0
Omega = 0.25
obliquity = 1.0471975511965976
use_flat_metric = true
use_deutsch_ic = false
use_deutsch_bc = false
use_static_background = true
damping_length = 22
damping_coef = 1.0
damping_exponent = 3.0

# --- particles ---
max_ptc_num = 800000000
q_e = 1.0
m_e = 1.0
ptc_absorb_radius = 13.0
use_recovery_gather = true
sort_interval = 20
random_seed = 42

# --- volumetric E.B-triggered injection ---
inj_shells = 1
inj_pairs_per_cell = 1
inj_interval = 0.04908738521234052
inj_weight = 240.0
inj_kT = 0.2
inj_buffer_frac = 0.9
inj_eb_threshold = 1e-3
inj_r_max = 10.0

fld_output_interval = 320
output_dir = "output"
sph_N_theta = 64
sph_N_phi = 128
inj_max_multiplicity = 10.0
# GCA hybrid: mu = 0 injection, GCA everywhere magnetized (rate 20 +
# E<0.9B margin), Boris near B nulls.
use_gca = true
include_curvature = true
# Hybrid switch as a RATE (inverse time), not per-step: the criterion is
# omega_c/gamma > this, with no dt in it, so the physical switching
# surface is identical at every level.  20.0 == the L6 baseline surface
# (old 0.1 at L6 dt) == the L7 gca005 A/B branch that restored it.
# Replaces gca_switch_omegac_dt, which aborts at init if present.
gca_switch_omegac = 20.0
gca_zero_mu_on_capture = false
inj_gca = true

# --- synchrotron cooling on the Boris branch (SYNC_COOLING_PLAN.md 2a) ---
# Landau-Lifshitz radiation reaction, operator-split after the Boris
# momentum update.  The GCA branch is untouched (it already holds mu = 0).
# This exists so the two sides of the hybrid switch run the SAME physics:
# without it, GCA was synchrotron-locked and Boris had no drag at all, so
# the switching surface -- which moves with dt -- left a footprint on the
# solution.  Note the drag preserves pitch angle at high gamma rather than
# zeroing it, and vanishes with the field, so the hot uncooled kinetic core
# inside the sheet survives on its own.
use_sync_cooling = true
# Raw Landau-Lifshitz coefficient, given directly rather than via
# sync_gamma_rad.  t_cool(gamma, B) = 1 / (sync_cooling_coef * gamma * B^2),
# a RATE coefficient in inverse time units -- identical meaning at every dt
# and level (runbook pitfall #14 discipline).  2.56e-3 is the value used by
# the L7 v3 cool branch, measured against that run's Boris-side population:
# t_cool/t_gyro < 1 across the whole Boris region, nu*dt <= 0.024.
# Equivalent to sync_gamma_rad = 5 anchored at B_LC = 15.625.
sync_cooling_coef = 2.56e-3
# Retained only so the init log can report the equivalent gamma_rad and
# t_cool; does not enter the physics when sync_cooling_coef is set.
sync_cool_b_lc = 15.625

# --- checkpoint/restart (new since t15; t15 died SIGKILLed at 2.5 P) ---
checkpoint_interval = 2560
checkpoint_keep = 2
restart_from = "auto"
