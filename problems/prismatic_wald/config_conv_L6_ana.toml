# Kerr-Wald convergence family, level 6 -- analytic reference
# Generated by make_conv_configs.py; edit that, not this.
#
# On-shell IC (field_spin = bh_spin): the analytic stationary Kerr-Wald
# state sampled on this level's mesh.  One step, so ic_aux.h5 carries the
# discrete-equilibrium residual dD/dt, dB/dt at the exact solution.

subdivision_level = 6
N_r    = 176
r_min  = 0.7
r_max  = 20.0
n_ghost_inner = 1
n_ghost_outer = 1

bh_spin         = 0.998
field_spin      = 0.998
background_spin = 0.998
B0              = 1.0
use_flat_metric = false

dt         = 0.0025
max_steps  = 1
use_implicit = true
implicit_beta = 0.52
implicit_iters = 5
use_static_background = true

damping_length = 48
damping_coef   = 0.2

fld_output_interval = 1
output_dir          = "Data_conv_L6_ana"

sph_N_theta = 90
sph_N_phi   = 180

update_d = true
update_b = true

# GRPIC_PLAN B1: constitutive Hodge map.  Pinned explicitly so the config
# means the same thing regardless of the solver's compiled-in default.
use_whitney_hodge = false
